name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Юнит-тесты (без X)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Компиляция
        run: |
          python3 -m compileall -q \
            zone-tiler.py zone-editor.py zone_reflow.py zone_config.py \
            zone_geom.py zone-picker.py zone_picker_nav.py \
            zone-daemon.py zone_ipc.py gridsnap-ctl setup-hotkeys.py \
            make-icon.py tests
      - name: Юнит-тесты
        run: python3 -m unittest discover -s tests -v

  package:
    name: Сборка пакетов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать tar.gz и deb
        run: |
          make tarball
          make deb
      - name: Проверить deb
        run: |
          set -e
          deb="$(ls dist/gridsnap_*.deb)"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -q usr/lib/gridsnap/zone-tiler.py
          dpkg-deb -c "$deb" | grep -q usr/lib/gridsnap/zone_geom.py
          dpkg-deb -c "$deb" | grep -q usr/lib/gridsnap/zone_ipc.py
          dpkg-deb -c "$deb" | grep -q usr/bin/gridsnap-tiler
          dpkg-deb -c "$deb" | grep -q usr/bin/gridsnap-ctl
          dpkg-deb -c "$deb" | grep -q \
            usr/share/applications/gridsnap.desktop
          tmp="$(mktemp -d)"
          dpkg-deb -x "$deb" "$tmp"
          python3 "$tmp/usr/lib/gridsnap/zone-tiler.py" --version
      - name: Проверить tar.gz и install.sh
        run: |
          set -e
          tb="$(ls dist/gridsnap-*.tar.gz)"
          tmp="$(mktemp -d)"
          tar -xzf "$tb" -C "$tmp"
          root="$(ls -d "$tmp"/gridsnap-*/)"
          "$root/install.sh" --prefix "$tmp/prefix" --no-launcher
          "$tmp/prefix/bin/gridsnap-tiler" --version
          test -x "$tmp/prefix/bin/gridsnap-ctl"
          "$tmp/prefix/bin/gridsnap-ctl" --version

  debian:
    name: Штатный пакет Debian (debian/)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-exec lintian
      - name: Собрать dpkg-buildpackage
        run: |
          set -e
          dpkg-buildpackage -b -us -uc
          deb="$(ls ../gridsnap_*.deb | head -n1)"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" > /tmp/deb.list
          grep -q usr/lib/gridsnap/zone-tiler.py /tmp/deb.list
          grep -q usr/lib/gridsnap/zone_geom.py /tmp/deb.list
          grep -q usr/bin/gridsnap-tiler /tmp/deb.list
          grep -q usr/bin/gridsnap-daemon /tmp/deb.list
          grep -q usr/bin/gridsnap-editor /tmp/deb.list
          grep -q usr/bin/setup-hotkeys /tmp/deb.list
          grep -q usr/share/applications/gridsnap.desktop /tmp/deb.list
          grep -q icons/hicolor/256x256/apps/gridsnap.png /tmp/deb.list
          lintian "$deb"

  smoke:
    name: Дымовой тест (Xvfb + muffin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Без actions/setup-python: PyGObject и cairo для оверлея берём из
      # apt и запускаем системным python3, а не сборкой из hostedtoolcache,
      # которая этих модулей не видит.
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb muffin x11-utils xdotool dbus cinnamon-settings-daemon \
            python3-gi gir1.2-gtk-3.0 gir1.2-pango-1.0 python3-cairo
      - name: Дымовой тест
        run: dbus-run-session -- sh tests/smoke.sh
      - name: Дымовой тест arrange+undo
        run: dbus-run-session -- sh tests/smoke-arrange.sh
      - name: Дымовой тест выбора зоны
        run: dbus-run-session -- sh tests/smoke-picker.sh
