name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Юнит-тесты (без X)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Компиляция
        run: |
          python3 -m compileall -q \
            zone-tiler.py zone-editor.py zone_reflow.py zone_config.py \
            zone_geom.py zone_units.py zone-picker.py zone_picker_nav.py zone_i18n.py \
            zone_actions.py zone_tabs.py zone-tabstrip.py zone_tabstrip_nav.py \
            zone-daemon.py zone_ipc.py gridsnap-ctl setup-hotkeys.py \
            make-icon.py tools tests
      - name: Юнит-тесты
        run: python3 -m unittest discover -s tests -v

  i18n:
    name: Каталоги переводов (gettext и po4a)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # python3-gi нужен не каталогам, а сверке man-страницы с `--help`: у трёх
      # команд из семи без GTK справка не запускается, и сверка ключей пропускается.
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext po4a python3-gi gir1.2-gtk-3.0 locales
          # Локали нужны проверкам man-страниц: под zh_CN.UTF-8 groff считает
          # иероглиф двумя колонками, под C — одной, и ширина страницы выходит
          # разной; без сгенерированной локали языковые проверки пропускаются.
          sudo localedef -i zh_CN -f UTF-8 zh_CN.UTF-8
          sudo localedef -i ru_RU -f UTF-8 ru_RU.UTF-8
      # check-i18n собирает .mo (msgfmt --check), сверяет шаблоны с кодом и
      # проверяет, что каталога `ru` нет: русский — это msgid как есть.
      - name: Каталоги gettext
        run: make check-i18n
      # check-man-i18n собирает man-страницы po4a и гоняет tests/test_man_i18n.py:
      # полнота каталогов, сверка ключей `--…` с `--help` всех семи команд, скелет
      # roff-макросов и проверка собранных страниц как у пользователя (временный
      # MANPATH вида <tmp>/usr/share/man плюс локаль: выбор языка, ширина в
      # колонках и «cannot break line»).
      - name: Каталоги man
        run: make check-man-i18n
      # Шаблон po4a обязан собираться из текущей страницы без изменений: иначе
      # правка man/gridsnap.1 забыла `make man-pot`, и перевод молча отстал.
      - name: Шаблон po4a не разошёлся со страницей
        run: |
          make man-pot
          git diff --exit-code -- po/man/

  package:
    name: Сборка пакетов
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # gettext и po4a нужны, чтобы собрать каталоги перевода и man-страницы:
      # tar.gz и deb кладут их внутрь, а install.sh ставит их в префикс.
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext po4a
      - name: Собрать tar.gz и deb
        run: |
          make tarball
          make deb
      - name: Проверить deb
        run: |
          set -e
          deb="$(ls dist/gridsnap_*.deb)"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -q usr/lib/gridsnap/zone-tiler.py
          dpkg-deb -c "$deb" | grep -q usr/lib/gridsnap/zone_geom.py
          dpkg-deb -c "$deb" | grep -q usr/lib/gridsnap/zone_ipc.py
          dpkg-deb -c "$deb" | grep -q usr/lib/gridsnap/zone_i18n.py
          dpkg-deb -c "$deb" | grep -q usr/bin/gridsnap-tiler
          dpkg-deb -c "$deb" | grep -q usr/bin/gridsnap-ctl
          dpkg-deb -c "$deb" | grep -q usr/share/locale/en/LC_MESSAGES/gridsnap.mo
          dpkg-deb -c "$deb" | grep -q usr/share/locale/zh_CN/LC_MESSAGES/gridsnap.mo
          # man-страницы: английская — по умолчанию (man1/), русская и китайская — по языкам
          dpkg-deb -c "$deb" | grep -q usr/share/man/man1/gridsnap.1.gz
          dpkg-deb -c "$deb" | grep -q usr/share/man/man1/gridsnap-tiler.1.gz
          dpkg-deb -c "$deb" | grep -q usr/share/man/man1/gridsnap-hotcorners.1.gz
          dpkg-deb -c "$deb" | grep -q usr/share/man/ru/man1/gridsnap.1.gz
          dpkg-deb -c "$deb" | grep -q usr/share/man/ru/man1/gridsnap-hotcorners.1.gz
          dpkg-deb -c "$deb" | grep -q usr/share/man/zh_CN/man1/gridsnap.1.gz
          dpkg-deb -c "$deb" | grep -q usr/share/man/zh_CN/man1/gridsnap-hotcorners.1.gz
          dpkg-deb -c "$deb" | grep -q usr/share/doc/gridsnap/LICENSE
          dpkg-deb -c "$deb" | grep -q \
            usr/share/applications/gridsnap.desktop
          tmp="$(mktemp -d)"
          dpkg-deb -x "$deb" "$tmp"
          python3 "$tmp/usr/lib/gridsnap/zone-tiler.py" --version
      - name: Проверить tar.gz и install.sh
        run: |
          set -e
          tb="$(ls dist/gridsnap-*.tar.gz)"
          tmp="$(mktemp -d)"
          tar -xzf "$tb" -C "$tmp"
          root="$(ls -d "$tmp"/gridsnap-*/)"
          "$root/install.sh" --prefix "$tmp/prefix" --no-launcher
          "$tmp/prefix/bin/gridsnap-tiler" --version
          test -x "$tmp/prefix/bin/gridsnap-ctl"
          "$tmp/prefix/bin/gridsnap-ctl" --version
          test -f "$tmp/prefix/share/locale/en/LC_MESSAGES/gridsnap.mo"
          test -f "$tmp/prefix/share/locale/zh_CN/LC_MESSAGES/gridsnap.mo"
          test -f "$tmp/prefix/share/man/man1/gridsnap.1"
          test -f "$tmp/prefix/share/man/man1/gridsnap-hotcorners.1"
          test -f "$tmp/prefix/share/man/ru/man1/gridsnap.1"
          test -f "$tmp/prefix/share/man/zh_CN/man1/gridsnap.1"
          # Всего 24 страницы: восемь (полная и семь .so-псевдонимов) на три языка.
          test "$(find "$tmp/prefix/share/man" -type f | wc -l)" -eq 24
          test -f "$tmp/prefix/share/doc/gridsnap/LICENSE"
          # Страница ставится в префикс вместе с псевдонимами, и man её открывает.
          man --warnings -E UTF-8 -l "$tmp/prefix/share/man/ru/man1/gridsnap.1" >/dev/null
          # Каталог работает из установленного префикса: под en русских букв нет.
          if GRIDSNAP_LANG=en "$tmp/prefix/bin/gridsnap-tiler" --help | grep -q '[а-яА-Я]'; then
            echo "под GRIDSNAP_LANG=en в справке осталась кириллица" >&2
            exit 1
          fi

  debian:
    name: Штатный пакет Debian (debian/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-exec lintian gettext po4a
      - name: Собрать dpkg-buildpackage
        run: |
          set -e
          dpkg-buildpackage -b -us -uc
          deb="$(ls ../gridsnap_*.deb | head -n1)"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" > /tmp/deb.list
          grep -q usr/lib/gridsnap/zone-tiler.py /tmp/deb.list
          grep -q usr/lib/gridsnap/zone_geom.py /tmp/deb.list
          grep -q usr/bin/gridsnap-tiler /tmp/deb.list
          grep -q usr/bin/gridsnap-daemon /tmp/deb.list
          grep -q usr/bin/gridsnap-editor /tmp/deb.list
          grep -q usr/bin/setup-hotkeys /tmp/deb.list
          grep -q usr/share/applications/gridsnap.desktop /tmp/deb.list
          grep -q icons/hicolor/256x256/apps/gridsnap.png /tmp/deb.list
          grep -q usr/share/man/man1/gridsnap.1.gz /tmp/deb.list
          grep -q usr/share/man/man1/gridsnap-hotcorners.1.gz /tmp/deb.list
          grep -q usr/share/man/ru/man1/gridsnap.1.gz /tmp/deb.list
          grep -q usr/share/man/zh_CN/man1/gridsnap.1.gz /tmp/deb.list
          lintian "$deb"

  smoke:
    name: Дымовой тест (Xvfb + muffin)
    runs-on: ubuntu-latest
    # Дедлайн вместо дефолтных 360 минут GitHub: зависший job (нет раннера, шаг
    # повис) убивается сам, а не держит прогон и PR в «ожидании».
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Без actions/setup-python: PyGObject и cairo для оверлея берём из
      # apt и запускаем системным python3, а не сборкой из hostedtoolcache,
      # которая этих модулей не видит.
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb muffin x11-utils xdotool dbus cinnamon-settings-daemon \
            python3-gi gir1.2-gtk-3.0 gir1.2-pango-1.0 python3-cairo python3-gi-cairo
      # Дымовые сценарии поднимают Xvfb и muffin: в CI окно иногда не успевает
      # получить геометрию от оконного менеджера, и проверка падает на тайминге,
      # а не на коде (локально тот же коммит проходит). run-smoke.sh даёт одну
      # повторную попытку: настоящая поломка упадёт обе.
      - name: Дымовой тест
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke.sh
      - name: Дымовой тест arrange+undo
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-arrange.sh
      - name: Дымовой тест выбора зоны
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-picker.sh
      - name: Дымовой тест горячих краёв
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-hotcorners.sh
      - name: Дымовой тест двух мониторов
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-monitors.sh
      - name: Дымовой тест исключений окон
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-ignore.sh
      - name: Дымовой тест режима «только эта зона»
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-focus.sh
      - name: Дымовой тест вкладок в зоне
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-tabs.sh
      - name: Дымовой тест действий
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-actions.sh
      - name: Дымовой тест привязки профиля к экрану
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-monitor-profiles.sh
      # HiDPI: сценарий сам выставляет GDK_SCALE=2, поэтому HiDPI-железо не нужно —
      # хватает Xvfb, а расхождение логических и физических пикселей видно и там.
      - name: Дымовой тест HiDPI-масштаба
        run: dbus-run-session -- sh tests/run-smoke.sh tests/smoke-dpi.sh
