# GridSnap gallery: “Cinema” — the video over the whole work area.
# A rule for the player: open a file and the window is already tiled into the only zone.

[gallery]
title = Cinema
description = One zone over the whole work area and a rule for players (mpv, VLC, Celluloid): the video fills the screen without a taskbar.
order = 60

[zones]
video = 0, 0, 1, 1

[rules]
re:(mpv|vlc|totem|celluloid|haruna|smplayer) = video

[keys]
video = <Super><Alt>1
