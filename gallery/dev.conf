# Галерея GridSnap: «Разработка» — терминал слева, редактор справа сверху,
# документация справа снизу. Правила раскладывают новые окна по назначению.

[gallery]
title = Разработка
description = Терминал слева, редактор справа сверху, документация справа снизу. Правила ставят терминалы влево, редакторы кода — наверх, браузер и справку — вниз.
order = 80

[zones]
term = 0, 0, 0.3, 1
code = 0.3, 0, 0.7, 0.65
docs = 0.3, 0.65, 0.7, 0.35

[rules]
re:(konsole|gnome-terminal|xfce4-terminal|kitty|alacritty) = term
re:(code|code-insiders|codium|gedit|sublime_text) = code
re:(firefox|chromium|google-chrome|devhelp|zeal) = docs

[keys]
term = <Super><Alt>1
code = <Super><Alt>2
docs = <Super><Alt>3
