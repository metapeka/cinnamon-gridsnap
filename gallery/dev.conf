# GridSnap gallery: “Development” — the terminal on the left, the editor top right,
# the documentation bottom right. Rules tile new windows by their job.

[gallery]
title = Development
description = The terminal on the left, the editor top right, the documentation bottom right. Rules put terminals left, code editors on top, the browser and the reference below.
order = 80

[zones]
term = 0, 0, 0.3, 1
code = 0.3, 0, 0.7, 0.65
docs = 0.3, 0.65, 0.7, 0.35

[rules]
re:(konsole|gnome-terminal|xfce4-terminal|kitty|alacritty) = term
re:(code|code-insiders|codium|gedit|sublime_text) = code
re:(firefox|chromium|google-chrome|devhelp|zeal) = docs

[keys]
term = <Super><Alt>1
code = <Super><Alt>2
docs = <Super><Alt>3
