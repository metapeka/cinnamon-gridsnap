# Галерея GridSnap: «Стрим» — сцена в центре, чат и монитор справа.
# Правила: OBS — в сцену, мессенджеры — в чат, браузер — в монитор.

[gallery]
title = Стрим
description = Игра или сцена слева, чат справа сверху, свой стрим справа снизу. Правила ставят OBS в сцену, Discord и Telegram — в чат, браузер — в монитор.
order = 70

[zones]
scene = 0, 0, 0.7, 1
chat = 0.7, 0, 0.3, 0.5
watch = 0.7, 0.5, 0.3, 0.5

[rules]
re:(obs|obs-studio) = scene
re:(discord|telegram|slack|element) = chat
re:(firefox|chromium|google-chrome) = watch

[keys]
scene = <Super><Alt>1
chat = <Super><Alt>2
watch = <Super><Alt>3
