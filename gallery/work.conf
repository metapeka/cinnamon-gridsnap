# Галерея GridSnap: «Работа» — почта и чат слева, редактор в центре, терминал снизу.
# Правила для приложений: окно новой программы сразу встаёт в свою зону.

[gallery]
title = Работа
description = Почта и чат слева, редактор в центре, терминал снизу, заметки справа. Правила кладут Firefox в редактор, Thunderbird и Telegram — к почте, терминалы — вниз.
order = 50

[zones]
mail = 0, 0, 0.25, 1
code = 0.25, 0, 0.5, 0.62
term = 0.25, 0.62, 0.5, 0.38
notes = 0.75, 0, 0.25, 1

[rules]
re:(firefox|chromium|google-chrome) = code
re:(thunderbird|telegram|slack|element) = mail
re:(konsole|gnome-terminal|xfce4-terminal|kitty) = term
re:(obsidian|keepassxc) = notes

[keys]
mail = <Super><Alt>1
code = <Super><Alt>2
term = <Super><Alt>3
notes = <Super><Alt>4
