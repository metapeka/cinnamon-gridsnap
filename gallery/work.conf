# GridSnap gallery: “Work” — mail and chat on the left, the editor in the centre, the terminal below.
# Rules for applications: a new program's window lands in its zone at once.

[gallery]
title = Work
description = Mail and chat on the left, the editor in the centre, the terminal below, notes on the right. Rules put Firefox into the editor, Thunderbird and Telegram by the mail, terminals at the bottom.
order = 50

[zones]
mail = 0, 0, 0.25, 1
code = 0.25, 0, 0.5, 0.62
term = 0.25, 0.62, 0.5, 0.38
notes = 0.75, 0, 0.25, 1

[rules]
re:(firefox|chromium|google-chrome) = code
re:(thunderbird|telegram|slack|element) = mail
re:(konsole|gnome-terminal|xfce4-terminal|kitty) = term
re:(obsidian|keepassxc) = notes

[keys]
mail = <Super><Alt>1
code = <Super><Alt>2
term = <Super><Alt>3
notes = <Super><Alt>4
