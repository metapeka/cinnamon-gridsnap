# Галерея GridSnap: «Две колонки».
# Формат — как у профиля ([zones]/[keys]/[rules]) плюс [gallery] с названием и
# описанием для меню. Зоны — x, y, w, h в долях рабочей области (0..1).
# Выбор в редакторе или `profile from-gallery two-columns` копирует раскладку в
# профиль пользователя: дальше её правят как свою.

[gallery]
title = Две колонки
description = Две равные колонки на всю высоту: слева основной документ, справа второй.
order = 10

[zones]
left = 0, 0, 0.5, 1
right = 0.5, 0, 0.5, 1

[keys]
left = <Super><Alt>1
right = <Super><Alt>2
