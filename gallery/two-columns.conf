# GridSnap gallery: “Two columns”.
# The format is the profile one ([zones]/[keys]/[rules]) plus [gallery] with a title
# and a description for the menu. Zones are x, y, w, h as fractions of the work area (0..1).
# A choice in the editor or `profile from-gallery two-columns` copies the layout into
# the user profile: from then on it is edited as one's own.

[gallery]
title = Two columns
description = Two equal full-height columns: the main document on the left, the second one on the right.
order = 10

[zones]
left = 0, 0, 0.5, 1
right = 0.5, 0, 0.5, 1

[keys]
left = <Super><Alt>1
right = <Super><Alt>2
