# po4a.conf — сборка локализованных man-страниц GridSnap.
#
# Язык-источник — английский (man/gridsnap.1), как и у строк интерфейса: каталога
# `en` тут нет, английская страница ложится копией источника (см. цель `make man`
# в Makefile). Русская и китайская собираются po4a из этого источника — русская
# страница была источником до инверсии языка (см. docs/specs/man-i18n.md).
#
#   make man-pot   # обновить шаблон po4a и подтянуть новые msgid в каталоги
#   make man       # собрать страницы в man/build/<язык>/man1/
#
# Шесть `.so`-псевдонимов не переводятся и в конфиг не входят: Makefile копирует
# их во все три языка (man-db резолвит `.so man1/gridsnap.1` внутри языка).

[po_directory] po/man
[type: man] man/gridsnap.1 $lang:man/build/$lang/man1/gridsnap.1
